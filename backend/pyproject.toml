[project]
name = "cabio-sales-os"
version = "1.0.0"
description = "Cabio Sales OS - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "structlog>=24.0.0",
    "PyJWT[crypto]>=2.8.0",
    "psycopg2-binary>=2.9.0",
    # zoneinfo (used for the Daily Activity Report's IST date handling) relies on
    # the OS's IANA tz database on Linux/Mac, but Windows doesn't ship one --
    # without this, ZoneInfo("Asia/Kolkata") raises ZoneInfoNotFoundError on Windows.
    "tzdata>=2024.1; sys_platform == 'win32'",
    # Supabase Storage REST calls (Opportunity Document Upload) -- promoted from
    # dev-only (FastAPI TestClient) to runtime now that app/core/storage.py uses it.
    "httpx>=0.27.0",
    # multipart/form-data parsing for UploadFile (Opportunity Document Upload).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"app/domains/*/models.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
